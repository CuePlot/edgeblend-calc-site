<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EdgeBlend Calc</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #111a2b;
        --text: #e7edf7;
        --muted: #9aa7ba;
        --accent: #22c7a9;
        --line: #253247;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 42px;
        letter-spacing: -0.03em;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      nav {
        display: flex;
        gap: 16px;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      nav a {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 14px;
        text-decoration: none;
        background: #0d1626;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>EdgeBlend Calc</h1>
        <p>
          EdgeBlend Calc is a professional projection planning utility for screen sizing,
          projector layout, overlap planning, brightness analysis, and lens shift positioning.
        </p>
        <nav>
          <a href="support.html">Support</a>
          <a href="privacy.html">Privacy Policy</a>
        </nav>
      </section>
    </main>
  </body>
</html>
